services:
  - type: web
    name: x-ai-lead-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PORT
        value: 8080
      - key: SCAN_INTERVAL_HOURS
        value: 24
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: X_CT0
        sync: false
      - key: X_AUTH_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
